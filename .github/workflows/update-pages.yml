name: Publish GitHub Pages

on:
  repository_dispatch:
    types: [build_and_deploy]
  workflow_dispatch:
    inputs:
      reset_last_tweet_id:
        description: '保存済みの lastTweetId を無視して直近24時間分から再取得する (worldCache は維持)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm Package
        run: |
          PUPPETEER_SKIP_DOWNLOAD=true PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm ci

      - name: Install multilingual fonts and locales
        timeout-minutes: 5
        run: |
          APT_OPTS=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=3)
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get "${APT_OPTS[@]}" install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji language-pack-ja language-pack-zh-hans language-pack-ko
          sudo locale-gen ja_JP.UTF-8 zh_CN.UTF-8 ko_KR.UTF-8
          sudo update-locale LANG=ja_JP.UTF-8
          echo "LANG=ja_JP.UTF-8" >> "$GITHUB_ENV"

      - name: Restore previous assets and state from GitHub Pages
        run: |
          mkdir -p work images
          fetch_optional() {
            local url="$1"
            local dest="$2"
            local code
            code=$(curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 --max-filesize 10485760 -s -w "%{http_code}" -o "$dest" "$url") || {
              rm -f "$dest"
              echo "Failed to fetch $url (curl error)" >&2
              return 1
            }
            if [ "$code" = "200" ]; then
              return 0
            elif [ "$code" = "404" ]; then
              rm -f "$dest"
              return 0
            else
              rm -f "$dest"
              echo "Unexpected HTTP $code fetching $url" >&2
              return 1
            fi
          }
          for platform in PC Quest; do
            for i in {0..35}; do
              fetch_optional "https://namanonamako.github.io/world-discover-poster/base_${platform}_${i}.jpg" "work/base_${platform}_${i}.jpg"
              fetch_optional "https://namanonamako.github.io/world-discover-poster/base_${platform}_d_${i}.jpg" "work/base_${platform}_d_${i}.jpg"
            done
          done
          fetch_optional "https://namanonamako.github.io/world-discover-poster/posterInfo.json" "work/posterInfo.json"
          fetch_optional "https://namanonamako.github.io/world-discover-poster/posterState.json" "work/posterState.json"
          find work -type f -empty -delete

      - name: Check GCP WIF configuration
        id: gcp_config
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          GCP_SA: ${{ secrets.GCP_SA }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$GCP_SA" ] && [ -n "$GCP_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        id: gcp_auth
        if: ${{ steps.gcp_config.outputs.enabled == 'true' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA }}

      - name: Get VRC_PROXY_TOKENS from Secret Manager
        id: gcp_secrets
        if: ${{ steps.gcp_auth.outcome == 'success' }}
        uses: google-github-actions/get-secretmanager-secrets@2b5f97c5a4b9c105e64646762ad4fc3f5128e6f5 # v2
        with:
          secrets: |-
            vrc_proxy_tokens:${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}/VRC_PROXY_TOKENS

      - name: Extract and mask API_AUTH_TOKEN
        id: proxy_token
        if: ${{ steps.gcp_secrets.outcome == 'success' }}
        env:
          VRC_PROXY_TOKENS_RAW: ${{ steps.gcp_secrets.outputs.vrc_proxy_tokens }}
        run: |
          TOKEN=$(printf '%s' "$VRC_PROXY_TOKENS_RAW" | jq -r '.API_AUTH_TOKEN // empty')
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            {
              echo "vrc_proxy_auth_token<<__EOF__"
              printf '%s\n' "$TOKEN"
              echo "__EOF__"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Revoke local GCP credential files and env vars
        if: ${{ always() && steps.gcp_auth.outcome == 'success' }}
        run: |
          for var in GOOGLE_GHA_CREDS_PATH GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE; do
            val="${!var:-}"
            if [ -n "$val" ] && [ -f "$val" ]; then
              CRED_SRC=$(jq -r '.credential_source.file // empty' "$val" 2>/dev/null || true)
              if [ -n "$CRED_SRC" ] && [ -f "$CRED_SRC" ]; then
                rm -f "$CRED_SRC"
              fi
              rm -f "$val"
            fi
          done
          rm -f "${GITHUB_WORKSPACE}"/gha-creds-*.json
          {
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Collect world introductions from Weir
        env:
          WEIR_API_KEY: ${{ secrets.WEIR_API_KEY }}
          VRC_PROXY_URL: ${{ vars.VRC_PROXY_URL || secrets.VRC_PROXY_URL }}
          VRC_PROXY_AUTH_TOKEN: ${{ secrets.VRC_PROXY_AUTH_TOKEN || steps.proxy_token.outputs.vrc_proxy_auth_token }}
          BLACKLIST: ${{ vars.BLACKLIST }}
          RESET_LAST_TWEET_ID: ${{ github.event_name == 'workflow_dispatch' && (inputs.reset_last_tweet_id == true || inputs.reset_last_tweet_id == 'true') }}
        run: node src/collect.js

      - name: Generate poster images
        env:
          BLACKLIST: ${{ vars.BLACKLIST }}
          GOOGLE_APPLICATION_CREDENTIALS: ""
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: ""
          GOOGLE_GHA_CREDS_PATH: ""
        run: node app.js

      - name: Check results
        run: ls -ltr images

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: images

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
