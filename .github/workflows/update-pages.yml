name: Publish GitHub Pages

on:
  schedule:
    - cron: '17,47 * * * *' # 30分毎 (毎時17分・47分に実行し混雑時間帯を回避)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm Package
        run: |
          PUPPETEER_SKIP_DOWNLOAD=true PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm ci

      - name: Restore previous assets and state from GitHub Pages
        run: |
          mkdir -p work images
          fetch_optional() {
            local url="$1"
            local dest="$2"
            local code
            code=$(curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 --max-filesize 10485760 -s -w "%{http_code}" -o "$dest" "$url") || {
              rm -f "$dest"
              echo "Failed to fetch $url (curl error)" >&2
              return 1
            }
            if [ "$code" = "200" ]; then
              return 0
            elif [ "$code" = "404" ]; then
              rm -f "$dest"
              return 0
            else
              rm -f "$dest"
              echo "Unexpected HTTP $code fetching $url" >&2
              return 1
            fi
          }
          for platform in PC Quest; do
            for i in {0..35}; do
              fetch_optional "https://namanonamako.github.io/world-discover-poster/base_${platform}_${i}.jpg" "work/base_${platform}_${i}.jpg"
              fetch_optional "https://namanonamako.github.io/world-discover-poster/base_${platform}_d_${i}.jpg" "work/base_${platform}_d_${i}.jpg"
            done
          done
          fetch_optional "https://namanonamako.github.io/world-discover-poster/posterInfo.json" "work/posterInfo.json"
          fetch_optional "https://namanonamako.github.io/world-discover-poster/posterState.json" "work/posterState.json"
          find work -type f -empty -delete

      - name: Collect world introductions from Weir
        env:
          WEIR_API_KEY: ${{ secrets.WEIR_API_KEY }}
          VRC_PROXY_URL: ${{ secrets.VRC_PROXY_URL }}
          VRC_PROXY_AUTH_TOKEN: ${{ secrets.VRC_PROXY_AUTH_TOKEN }}
          BLACKLIST: ${{ vars.BLACKLIST }}
        run: node src/collect.js

      - name: Install multilingual fonts and locales
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji language-pack-ja language-pack-zh-hans language-pack-ko
          sudo locale-gen ja_JP.UTF-8 zh_CN.UTF-8 ko_KR.UTF-8
          sudo update-locale LANG=ja_JP.UTF-8
          echo "LANG=ja_JP.UTF-8" >> "$GITHUB_ENV"

      - name: Generate poster images
        env:
          BLACKLIST: ${{ vars.BLACKLIST }}
        run: node app.js

      - name: Check results
        run: ls -ltr images

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my_site
          path: images
          retention-days: 1

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: images

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
