name: Publish GitHub Pages

on:
  repository_dispatch:
    types: [build_and_deploy]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
    
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Inspect files before checkout
        run: ls -la
      - name: show current directory before checkout
        run: pwd
      - uses: actions/checkout@v3
      - name: Inspect files after checkout
        run: ls -la
      - name: show current directory after checkout
        run: pwd
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install npm Package
        run: |
          PUPPETEER_SKIP_DOWNLOAD=true PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true npm ci
      - name: copyfiles
        env:
          API_KEY: ${{ secrets.WORLD_INTRODUCTION_API_KEY }}
        run: |
          for platform in PC Quest; do
            for i in {0..35}; do
              curl --retry-all-errors --retry 3 --retry-delay 2 -s -f -o work/base_${platform}_${i}.jpg "https://namanonamako.github.io/world-discover-poster/base_${platform}_${i}.jpg" || rm -f work/base_${platform}_${i}.jpg
              curl --retry-all-errors --retry 3 --retry-delay 2 -s -f -o work/base_${platform}_d_${i}.jpg "https://namanonamako.github.io/world-discover-poster/base_${platform}_d_${i}.jpg" || rm -f work/base_${platform}_d_${i}.jpg
            done
          done
          curl --retry-all-errors --retry 3 --retry-delay 2 -s -f -o work/posterInfo.json https://namanonamako.github.io/world-discover-poster/posterInfo.json || rm -f work/posterInfo.json
          # v2 API
          curl --retry-all-errors --retry 3 --retry-delay 2 -s -f -H "X-API-Key: $API_KEY" -o work/posterData.json https://discovery-poster-collector-403988156537.us-west1.run.app/world-introductions
          find work -type f -empty -delete
      - name: Install multilingual fonts and locales
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji language-pack-ja language-pack-zh-hans language-pack-ko
          sudo locale-gen ja_JP.UTF-8 zh_CN.UTF-8 ko_KR.UTF-8
          sudo update-locale LANG=ja_JP.UTF-8
          echo "LANG=ja_JP.UTF-8" >> $GITHUB_ENV
      - name: start action...
        env:
          BLACKLIST: ${{ vars.BLACKLIST }}
        run: >
          node app.js
      - name: check results
        run: >
          ls -ltr images
      - uses: actions/upload-artifact@v4
        with:
          name: my_site
          path: images
      - uses: actions/upload-pages-artifact@v3
        with:
          path: images

  deploy:
    needs: build
    runs-on: ubuntu-latest 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clean up v2 data
        env:
          API_KEY: ${{ secrets.WORLD_INTRODUCTION_API_KEY }}
        run: |
          echo "Sending DELETE request to cleanup v2 data..."
          err_file=$(mktemp)
          response=$(curl -X DELETE -s -S \
            --connect-timeout 10 \
            --max-time 30 \
            -w "\n%{http_code}" \
            -H "X-API-Key: $API_KEY" \
            https://discovery-poster-collector-403988156537.us-west1.run.app/world-introductions \
            2>"$err_file") || curl_exit=$?
          curl_err=$(cat "$err_file")
          rm -f "$err_file"

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "${curl_exit:-0}" -ne 0 ] || [[ ! "$http_code" =~ ^2[0-9]{2}$ ]]; then
            echo "::warning title=Clean up v2 data failed::DELETE request failed with HTTP status '${http_code:-N/A}' (curl exit code: ${curl_exit:-0})."
            {
              echo "### ⚠️ Clean up v2 data failed"
              echo "Poster was successfully deployed, but server-side data cleanup returned an error."
              echo "- **HTTP Status**: \`${http_code:-N/A}\`"
              echo "- **Curl Exit Code**: \`${curl_exit:-0}\`"
              if [ -n "$curl_err" ]; then
                echo "- **Curl Error**:"
                echo "\`\`\`"
                echo "$curl_err"
                echo "\`\`\`"
              fi
              echo "- **Response Body**:"
              echo "\`\`\`"
              echo "${body:-<empty>}"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "Clean up v2 data succeeded with HTTP $http_code."
          fi


